[package]
name = "av-music"
version = "0.5.7"
description = "Reproductor de música local con visualizador reactivo"
authors = ["A.V Music"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
lofty = "0.22"
base64 = "0.22"
rfd = "0.15"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
