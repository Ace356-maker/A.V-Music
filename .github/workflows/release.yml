# Publica una versión nueva de A.V Music.
#
# Cómo lanzar una actualización:
#   1. Sube la versión en los tres sitios: `pnpm bump 0.2.0`
#   2. Commit + tag:  `git add -A && git commit -m "v0.2.0" && git tag v0.2.0`
#   3. Sube el tag:   `git push origin v0.2.0`
#
# El workflow compila el instalador (NSIS), lo firma con tu clave privada y
# sube a GitHub Releases junto con `latest.json` — el archivo que la app
# consulta al arrancar para saber que existe la versión nueva. Los usuarios
# con la app instalada reciben el aviso y se actualizan solos.

name: Release

on:
  push:
    tags:
      - "v*"
  # También se puede lanzar a mano desde la pestaña Actions (útil para
  # re-probar sin tocar tags).
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # tauri-action NO instala las dependencias: sin `pnpm install` el
      # beforeBuildCommand (`pnpm build`) falla en un runner limpio.
      - name: Instalar dependencias del frontend
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Fallo rápido y claro si falta la clave de firma (Settings → Secrets
      # → Actions → TAURI_SIGNING_PRIVATE_KEY), en vez de compilar 15 min
      # para recién fallar al firmar. OJO: GitHub no permite `secrets` en
      # condiciones `if:`, por eso la clave se pasa por env y se comprueba
      # en el shell.
      - name: Verificar la clave de firma
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Falta el secreto TAURI_SIGNING_PRIVATE_KEY (Settings > Secrets and variables > Actions del repo, con el contenido de avmusic.key)."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::Falta el secreto TAURI_SIGNING_PRIVATE_KEY_PASSWORD (la contraseña que le pusiste a la llave)."
            exit 1
          fi
          echo "Clave y contraseña de firma encontradas"

      - name: Compilar y publicar el release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # La clave privada de firma (generada con `pnpm tauri signer
          # generate`). Configúrala en Settings → Secrets and variables →
          # Actions del repo. NUNCA la subas al código.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "A.V Music v__VERSION__"
          releaseBody: "Nueva versión de A.V Music."
          releaseDraft: false
          prerelease: false
          # Genera y adjunta `latest.json` (el manifiesto que consulta la app).
          includeUpdaterJson: true

      - name: Limpiar assets (dejar solo el instalador .exe)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Obtiene el tag actual o la última release
          TAG_NAME="v$(node -p "require('./package.json').version")"
          echo "Buscando release para el tag: $TAG_NAME"
          
          # Si la release ya se creó, eliminar los archivos .sig, .msi, latest.json si no quieres que aparezcan
          # NOTA: Si quieres mantener el ejecutable .exe únicamente:
          gh release view "$TAG_NAME" --json assets --jq '.assets[].name' | while read -r asset; do
            if [[ "$asset" != *".exe" ]]; then
              echo "Eliminando asset no deseado: $asset"
              gh release delete-asset "$TAG_NAME" "$asset" -y || true
            fi
          done

